services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-better_buy}
      POSTGRES_USER: ${POSTGRES_USER:-better_buy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-better_buy_local}
    volumes:
      - better_buy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  better_buy_postgres_data:
